<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CellSim 3D — интерактивный симулятор клетки</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05050f;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #e0e8ff;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
    }

    canvas { display: block; }
    #app { width: 100%; height: 100%; position: fixed; inset: 0; }

    /* ============================================================
       Левая панель со сценариями
       ============================================================ */
    #ui-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 280px;
      height: 100%;
      background: rgba(10, 15, 35, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-right: 1px solid rgba(80, 140, 255, 0.3);
      padding: 20px;
      overflow-y: auto;
      z-index: 20;
      transition: transform 0.3s ease;
    }

    .ui-title h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      background: linear-gradient(90deg, #66aaff, #aa66ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 11px;
      color: #6677aa;
      margin-bottom: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .ui-section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #5566aa;
      margin: 16px 0 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(80, 140, 255, 0.15);
    }

    .scenario-btn {
      display: block;
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 6px;
      background: rgba(30, 45, 90, 0.5);
      border: 1px solid rgba(80, 140, 255, 0.25);
      border-radius: 6px;
      color: #c0d0ff;
      font-size: 12.5px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .scenario-btn:hover,
    .scenario-btn:active {
      background: rgba(60, 90, 180, 0.5);
      border-color: rgba(120, 180, 255, 0.6);
    }
    .scenario-btn.active {
      background: linear-gradient(90deg, rgba(80, 130, 255, 0.6), rgba(150, 80, 255, 0.6));
      border-color: #88aaff;
      color: #fff;
      box-shadow: 0 0 15px rgba(100, 150, 255, 0.4);
    }

    /* ============================================================
       Кнопка-гамбургер (показывается только на мобильных)
       ============================================================ */
    #burger {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 30;
      width: 40px;
      height: 40px;
      background: rgba(10, 15, 35, 0.9);
      border: 1px solid rgba(80, 140, 255, 0.4);
      border-radius: 8px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #burger svg {
      width: 20px;
      height: 20px;
      stroke: #88bbff;
      stroke-width: 2;
      fill: none;
    }

    /* Затемнение за панелью, когда она открыта на мобильных */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 15;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #overlay.visible {
      display: block;
      opacity: 1;
    }

    /* ============================================================
       Инфо-карточка сценария
       ============================================================ */
    #ui-info {
      position: fixed;
      bottom: 20px;
      right: 20px;
      max-width: 340px;
      background: rgba(10, 15, 35, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(80, 140, 255, 0.3);
      border-radius: 8px;
      padding: 14px 18px;
      z-index: 10;
      font-size: 12px;
      line-height: 1.5;
      color: #a0b0dd;
    }
    #ui-info h3 {
      font-size: 13px;
      color: #88bbff;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    /* ============================================================
       Карточка органеллы (при клике)
       ============================================================ */
    #ui-organelle {
      position: fixed;
      left: 300px;
      bottom: 20px;
      max-width: 380px;
      max-height: 50vh;
      overflow-y: auto;
      background: rgba(10, 15, 35, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(150, 100, 255, 0.4);
      border-radius: 8px;
      padding: 16px 20px;
      z-index: 12;
      font-size: 12px;
      line-height: 1.55;
      color: #c0d0ff;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
    }
    #ui-organelle.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    #ui-organelle h3 {
      font-size: 14px;
      color: #cc99ff;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    #ui-organelle .organelle-short {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #8877aa;
      margin-bottom: 10px;
    }
    #ui-organelle p {
      margin-bottom: 10px;
      color: #a8b8dd;
    }
    #ui-organelle ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #ui-organelle li {
      position: relative;
      padding-left: 16px;
      margin-bottom: 4px;
      font-size: 11.5px;
      color: #90a0cc;
    }
    #ui-organelle li::before {
      content: '·';
      position: absolute;
      left: 4px;
      color: #88bbff;
      font-weight: bold;
    }

    /* Кнопка закрытия карточки органеллы */
    #ui-organelle .close-btn {
      position: absolute;
      top: 8px;
      right: 10px;
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      color: #8877aa;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      padding: 0;
      display: none;
    }
    #ui-organelle.visible .close-btn {
      display: block;
    }

    /* ============================================================
       Легенда молекул
       ============================================================ */
    #ui-legend {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(10, 15, 35, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(80, 140, 255, 0.25);
      border-radius: 8px;
      padding: 12px 16px;
      z-index: 10;
      font-size: 11px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0;
      color: #a0b0dd;
    }
    .legend-item .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      box-shadow: 0 0 8px currentColor;
    }

    /* ============================================================
       Подсказка управления
       ============================================================ */
    #ui-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #445588;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
    }

    /* ============================================================
       FPS-счётчик
       ============================================================ */
    #fps-meter {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 6px 10px;
      background: rgba(10, 15, 35, 0.85);
      border: 1px solid rgba(80, 140, 255, 0.3);
      border-radius: 6px;
      font-size: 11px;
      color: #88bbff;
      font-family: ui-monospace, monospace;
      z-index: 12;
      pointer-events: none;
    }

    /* Скроллбар */
    #ui-panel::-webkit-scrollbar,
    #ui-organelle::-webkit-scrollbar {
      width: 6px;
    }
    #ui-panel::-webkit-scrollbar-thumb,
    #ui-organelle::-webkit-scrollbar-thumb {
      background: rgba(80, 140, 255, 0.3);
      border-radius: 3px;
    }

    /* ============================================================
       Адаптивность
       ============================================================ */

    /* Средние экраны — уменьшаем карточки */
    @media (max-width: 1200px) {
      #ui-info { max-width: 280px; font-size: 11.5px; }
      #ui-organelle { max-width: 320px; }
      #ui-hint { display: none; }
    }

    /* Планшеты */
    @media (max-width: 900px) {
      #ui-panel { width: 240px; }
      #ui-organelle { left: 260px; max-width: 280px; }
      #ui-legend { font-size: 10px; padding: 10px 12px; }
      #ui-info { max-width: 240px; padding: 12px 14px; }
    }

    /* ============================================================
       Мобильные — панель в бургер-меню
       ============================================================ */
    @media (max-width: 720px) {
      /* Показываем кнопку-гамбургер */
      #burger { display: flex; }

      /* Панель выезжает слева, по умолчанию спрятана */
      #ui-panel {
        width: 260px;
        padding: 16px;
        transform: translateX(-100%);
        background: rgba(10, 15, 35, 0.97);
      }
      #ui-panel.open {
        transform: translateX(0);
      }

      /* Сдвигаем заголовок вниз от бургера */
      .ui-title h1 {
        font-size: 16px;
        margin-top: 40px;
      }
      .subtitle {
        font-size: 9px;
        margin-bottom: 12px;
      }
      .scenario-btn {
        padding: 10px 12px;
        font-size: 12px;
        margin-bottom: 5px;
      }

      /* Инфо-карточка внизу на всю ширину */
      #ui-info {
        left: 10px;
        right: 10px;
        bottom: 10px;
        max-width: none;
        padding: 10px 14px;
        font-size: 11px;
      }
      #ui-info h3 {
        font-size: 12px;
        margin-bottom: 4px;
      }

      /* Карточка органеллы поверх всего внизу */
      #ui-organelle {
        left: 10px;
        right: 10px;
        bottom: 10px;
        max-width: none;
        max-height: 45vh;
        padding: 14px 16px;
        font-size: 11px;
      }
      #ui-organelle h3 { font-size: 13px; padding-right: 24px; }
      #ui-organelle p { font-size: 11px; }
      #ui-organelle li { font-size: 10.5px; }

      /* Легенду прячем в бургер-меню, чтобы не мешала */
      #ui-legend {
        top: 12px;
        right: 12px;
        font-size: 10px;
        padding: 8px 10px;
      }
      #ui-legend .legend-item {
        margin: 3px 0;
      }

      /* FPS-счётчик в правом верхнем углу */
      #fps-meter {
        top: 12px;
        right: 12px;
        bottom: auto;
        font-size: 10px;
        padding: 5px 8px;
      }
    }

    /* Очень узкие экраны — прячем легенду */
    @media (max-width: 500px) {
      #ui-legend { display: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Кнопка-гамбургер для мобильных -->
  <button id="burger" aria-label="Меню">
    <svg viewBox="0 0 24 24">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <!-- Затемнение за панелью -->
  <div id="overlay"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
